name: Terraform AWS (Manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

env:
  TF_VERSION: "1.11.0"
  AWS_REGION: "us-east-1"

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: read

jobs:
  terraform:
    name: "Terraform ${{ inputs.action }}"
    runs-on: ubuntu-latest
    # apply still requires manual approval via the environment's required reviewers,
    # even though you already chose "apply" from the dropdown
    environment: ${{ inputs.action == 'apply' && 'production' || '' }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # e.g. arn:aws:iam::123456789012:role/github-actions-tf
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false -no-color

      - name: Terraform Plan (pre-apply)
        if: inputs.action == 'apply'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan
